name: "Setup Tattle Build Dependencies"
description: "Install common Linux apt build dependencies for Tattle"
inputs:
  extra-packages:
    description: "Additional packages to install"
    required: false
    default: ""
  github-token:
    description: "GitHub token for authenticating git operations"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Configure Git authentication for GitHub
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        if [ -n "$GH_TOKEN" ]; then
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi
    - name: Install APT dependencies
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        sudo apt-get update -y
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends \
          ninja-build \
          ccache \
          pkg-config \
          libwayland-dev \
          wayland-protocols \
          qtkeychain-qt6-dev \
          libsecret-1-dev \
          libevdev-dev \
          libcap-dev \
          libasound2-dev \
          libpulse-dev \
          $EXTRA_PACKAGES
