name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      qml: ${{ steps.filter.outputs.qml }}
      workflows_scripts: ${{ steps.filter.outputs.workflows_scripts }}
      packaging: ${{ steps.filter.outputs.packaging }}
      version: ${{ steps.filter.outputs.version }}
      changelog: ${{ steps.filter.outputs.changelog }}
      package_matrix: ${{ steps.pkg-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            cpp:
              - 'src/**/*.{cpp,h}'
              - 'src/**/CMakeLists.txt'
              - 'src/**/CMakePresets.json'
              - 'tests/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
            qml:
              - 'src/ui/**/*.qml'
              - 'src/ui/CMakeLists.txt'
            workflows_scripts:
              - '.github/**'
              - 'packaging/**'
              - 'scripts/**'
            packaging:
              - 'packaging/**'
            version:
              - 'VERSION'
            changelog:
              - 'CHANGELOG.md'

      - name: Determine packaging matrix
        id: pkg-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          VERSION_CHANGED: ${{ steps.filter.outputs.version }}
          PACKAGING_CHANGED: ${{ steps.filter.outputs.packaging }}
        run: |
          FULL='{"include":[{"target":"deb","name":"Debian (.deb)","file":"packaging/deb/Dockerfile.deb","outdir":"dist/deb"},{"target":"arch","name":"Arch Linux (.pkg.tar.zst)","file":"packaging/arch/Dockerfile.arch","outdir":"dist/arch"},{"target":"rpm","name":"Fedora RPM (.rpm)","file":"packaging/rpm/Dockerfile.rpm","outdir":"dist/rpm"}]}'
          PR_FAST='{"include":[{"target":"rpm","name":"Fedora RPM (.rpm)","file":"packaging/rpm/Dockerfile.rpm","outdir":"dist/rpm"}]}'
          if { [ "${EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; } || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "matrix=${FULL}" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "pull_request" ] && { [ "${VERSION_CHANGED}" = "true" ] || [ "${PACKAGING_CHANGED}" = "true" ]; }; then
            echo "matrix=${FULL}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=${PR_FAST}" >> "$GITHUB_OUTPUT"
          fi

  validate-version:
    name: Validate VERSION File (Semantic Versioning)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.version == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check VERSION file format
        run: |
          test -f VERSION || (echo "ERROR: VERSION file is missing" && exit 1)
          APP_VER=$(tr -d '[:space:]' < VERSION)
          echo "Canonical version in VERSION: ${APP_VER}"
          if ! [[ "${APP_VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: VERSION '${APP_VER}' does not follow Semantic Versioning (X.Y.Z)"
            exit 1
          fi
          echo "VERSION file format is valid semver."

  validate-changelog:
    name: Validate CHANGELOG.md (Keep a Changelog)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.changelog == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate CHANGELOG format
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          validation_level: error

  lint-and-format:
    name: Code Quality, Formatting & Linting (pre-commit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pre-commit and clang-format
        run: pip install pre-commit==4.7.0 clang-format==22.1.8

      - name: Cache pre-commit environments
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: |
          echo "Running pre-commit hooks on all files..."
          pre-commit run --all-files --show-diff-on-failure

  lint-workflows-and-scripts:
    name: Lint Workflows & Scripts (actionlint, zizmor, hadolint, shellcheck)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.workflows_scripts == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"

      - name: Run actionlint on GitHub Actions workflows
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Run zizmor security audit on GitHub Actions
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium

      - name: Run hadolint on Dockerfiles
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/mnt:ro" -w /mnt hadolint/hadolint:2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e hadolint \
            packaging/deb/Dockerfile.deb \
            packaging/rpm/Dockerfile.rpm \
            packaging/arch/Dockerfile.arch

      - name: Run shellcheck on packaging scripts
        run: |
          shellcheck \
            --exclude=SC2034,SC2154,SC2164 \
            packaging/deb/build-deb.sh \
            packaging/rpm/build-rpm.sh \
            packaging/arch/build-arch.sh \
            packaging/deb/postinst \
            packaging/deb/prerm \
            packaging/deb/postrm \
            packaging/arch/tattle.install \
            packaging/arch/PKGBUILD \
            scripts/ci/check-wayland-only.sh

      - name: Verify .SRCINFO is in sync with PKGBUILD
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/packaging/arch:/pkg:ro" \
            archlinux:base-devel@sha256:61f7de2dd88cc4ba1fe36c24cfe1a503c3936984492d6405eeab013ce6ac68c5 \
            bash -c "useradd -m u && cp /pkg/PKGBUILD /pkg/tattle.install /home/u/ && chown -R u:u /home/u && su u -c 'cd /home/u && makepkg --printsrcinfo'" > /tmp/generated-srcinfo
          if ! diff -u packaging/arch/.SRCINFO /tmp/generated-srcinfo; then
            echo "ERROR: packaging/arch/.SRCINFO is out of sync with PKGBUILD."
            echo "Regenerate with: makepkg --printsrcinfo > packaging/arch/.SRCINFO"
            exit 1
          fi

  lint-qml:
    name: QML Linting & AOT Verification (qmllint & aotstats)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.qml == 'true' || needs.detect-changes.outputs.cpp == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.2'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'

      - name: Install build dependencies
        uses: ./.github/actions/setup-build-deps
        with:
          github-token: ${{ github.token }}

      - name: Cache compiler objects
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-lint-qml-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-lint-qml-

      - name: Configure CMake
        run: |
          cmake -B build -S . -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};/usr/lib/x86_64-linux-gnu" \
            -DENABLE_QT_DEPLOYMENT=OFF \
            -DBUILD_KEYINJECTORD=ON

      - name: Run qmllint on QML codebase
        run: |
          ninja -C build all_qmllint

      - name: Generate AOT compilation stats
        run: |
          cmake --build build --target all_aotstats
          test -f build/.rcc/qmlcache/all_aotstats.txt
          cp build/.rcc/qmlcache/all_aotstats.txt build/all_aotstats.txt
          ccache --show-stats

      - name: Validate QML AOT compilation
        run: |
          STRICT_AOT=1 bash scripts/ci/check-aot-stats.sh build

      - name: Upload QML AOT stats artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qml-aotstats
          path: build/all_aotstats.txt
          if-no-files-found: warn

  analyze:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cpp == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.2'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'

      - name: Install LLVM 22 and Clang-Tidy 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang-22 clang-tidy-22

      - name: Install Build Tools
        uses: ./.github/actions/setup-build-deps
        with:
          github-token: ${{ github.token }}

      - name: Cache compiler objects
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-clang-tidy-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang-tidy-

      - name: Configure CMake with Clang and Clang-Tidy
        run: |
          cmake -B build -S . -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};/usr/lib/x86_64-linux-gnu" \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCLANG_TIDY_EXE=clang-tidy-22 \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_CLANG_TIDY=ON \
            -DENABLE_QT_DEPLOYMENT=OFF \
            -DBUILD_KEYINJECTORD=ON

      - name: Run Clang-Tidy on first-party targets
        run: |
          ninja -C build tattle_core keyinjectord tattle tattled
          ccache --show-stats

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.cpp == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            preset: ci-sanitizer
          - name: tsan
            preset: ci-sanitizer-tsan
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Qt 6.11.2
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.11.2'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true
          setup-python: false
          aqtversion: '==3.3.0'

      - name: Install build dependencies and sanitizer runtime libraries
        uses: ./.github/actions/setup-build-deps
        with:
          extra-packages: "libasan8 libubsan1 libtsan2"
          github-token: ${{ github.token }}

      - name: Cache compiler objects
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-

      - name: Configure CMake with ${{ matrix.name }}
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};/usr/lib/x86_64-linux-gnu" \
            -DENABLE_QT_DEPLOYMENT=OFF

      - name: Build targets under ${{ matrix.name }}
        run: |
          cmake --build --preset ${{ matrix.preset }}
          ccache --show-stats

      - name: Run test suite under ${{ matrix.name }}
        run: |
          ctest --preset ${{ matrix.preset }} --output-on-failure

  package-validation:
    name: Package Validation
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.package_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from VERSION file
        id: get-version
        run: |
          APP_VER=$(tr -d '[:space:]' < VERSION)
          echo "version=${APP_VER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & Validate ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: export
          outputs: type=local,dest=./${{ matrix.outdir }}
          build-args: |
            APP_VERSION=${{ steps.get-version.outputs.version }}
          cache-from: type=gha,scope=pkg-${{ matrix.target }}
          cache-to: type=gha,mode=min,scope=pkg-${{ matrix.target }}

      - name: Verify package artifacts
        env:
          OUTDIR: ${{ matrix.outdir }}
        run: |
          echo "Listing generated package artifacts in ./${OUTDIR}:"
          ls -lh "./${OUTDIR}"
          if [ -z "$(ls -A "./${OUTDIR}")" ]; then
            echo "ERROR: No package artifacts found in ./${OUTDIR}"
            exit 1
          fi

      - name: Assert Wayland-only packaging config
        if: matrix.target == 'deb'
        run: bash scripts/ci/check-wayland-only.sh
